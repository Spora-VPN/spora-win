[package]
name = "spora-wincore"
version.workspace = true
license.workspace = true
publish = false
edition = "2024"

[dependencies]
# Sibling checkout of the main spora repo (this repo was extracted from it).
spora-core = { path = "../../spora/spora-core" }
# Client-side host integration (wintun adapter, routes, resolver, MTU,
# outer-socket bypass) — the same crate `spora use` is built on.
spora-vpn = { path = "../../spora/spora-vpn" }
# The service layer every Spora client links: the device identity and the
# access to Spora's relays, the diagnostic log, crash files, connection-record
# upload (telemetry) and bug-report bundles.
spora-service = { path = "../../spora/spora-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tonic = "0.13"
prost = "0.13"
log = "0.4"
env_logger = "0.11"
url = "2.5"
futures-util = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
# The control pipe's DACL and its callers' user (src/pipe.rs), the private
# state directories' DACL (src/paths.rs) and the DPAPI-kept state key
# (src/secret.rs). The tunnel adapter, routes and resolver are spora-vpn's
# business.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
tonic-build = "0.13"
# Version resource for the Windows executable; uses the mingw windres for
# the gnu target.
winresource = "0.1"
