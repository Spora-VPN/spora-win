[package]
name = "spora-wincore"
version = "0.1.0"
edition = "2024"

[dependencies]
# Sibling checkout of the main spora repo (this repo was extracted from it).
spora-core = { path = "../../spora/spora-core" }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tonic = "0.13"
prost = "0.13"
log = "0.4"
env_logger = "0.11"
url = "2.5"
futures-util = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-service = "0.7"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[build-dependencies]
tonic-build = "0.13"
