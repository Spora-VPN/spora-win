[package]
name = "spora-winui"
version.workspace = true
edition = "2024"

[dependencies]
slint = { version = "1.15", default-features = false, features = ["backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
arboard = "3"
chrono = "0.4"
# Share blobs in the saved-connections file.
base64 = "0.22"
# Tray icon (state-shaped, rendered from the mono mark at runtime) + its
# right-click menu. Both are cross-platform crates, gated to Windows below.
resvg = "0.46"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25"
# Windows toast notifications (WinRT) for sharing started / connected / lost.
tauri-winrt-notification = "0.8"
# Named-pipe connector for the gRPC channel to the wincore service.
tower = { version = "0.5", features = ["util"] }
hyper-util = "0.1"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    # CreateFileW is gated on Win32_Security (it takes a SECURITY_ATTRIBUTES).
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # Tray icon size + taskbar theme (tray.rs), toast attribution key (toast.rs).
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }

[build-dependencies]
slint-build = "1.15"
tonic-build = "0.13"
# Embeds assets/spora.ico into the Windows executable (Explorer, taskbar,
# shortcuts); uses the mingw windres for the gnu target.
winresource = "0.1"
