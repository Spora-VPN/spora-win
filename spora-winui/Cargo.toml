[package]
name = "spora-winui"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.15", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2"] }
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
arboard = "3"

[build-dependencies]
slint-build = "1.15"
tonic-build = "0.13"
